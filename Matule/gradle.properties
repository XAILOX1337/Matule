# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX package structure
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Each library's R class contains only its own resources
android.nonTransitiveRClass=true
# Адрес сервера PocketBase. По умолчанию http://10.0.2.2:8090/ (эмулятор).
# Для телефона по Wi-Fi укажите IP компьютера:
# MATULE_API_URL=http://192.168.1.10:8090/
# API-ключ AppMetrica (кабинет https://appmetrica.yandex.ru). Пока ключ не задан,
# аналитика пишется в Logcat (тег MatuleAnalytics), SDK не инициализируется.
# MATULE_APPMETRICA_KEY=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
